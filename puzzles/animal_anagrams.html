<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animal Anagrams</title>
    <link rel="stylesheet" href="../styles/neumorphic.css" />
    <style>
      .example {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 10px;
      }

      .word-chip {
        background: var(--accent);
        color: #fff;
        padding: 4px 13px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 0.9rem;
        letter-spacing: 0.05em;
        box-shadow: var(--shadow-extruded-small);
      }

      .word-chip.answer {
        background: var(--success);
      }

      .sym {
        font-weight: 700;
        color: var(--muted);
        font-size: 1rem;
      }

      .anagram-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
      }

      .anagram-card {
        border-radius: var(--radius-base);
        padding: 16px;
        background: var(--bg);
        box-shadow: var(--shadow-extruded-small);
        transition: box-shadow var(--transition), background var(--transition);
      }

      .anagram-card.solved {
        background: color-mix(in srgb, var(--success) 12%, var(--bg));
        box-shadow: var(--shadow-inset);
      }

      .puzzle-words {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 12px;
      }

      .puzzle-word {
        background: var(--accent);
        color: #fff;
        padding: 5px 14px;
        border-radius: 999px;
        font-weight: 700;
        font-size: 1rem;
        letter-spacing: 0.06em;
        box-shadow: var(--shadow-extruded-small);
      }

      .puzzle-input-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }

      .puzzle-input {
        flex: 1;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }

      .puzzle-input.wrong {
        background: color-mix(in srgb, var(--error) 10%, var(--bg));
        animation: shake 0.4s ease;
      }

      @keyframes shake {
        0%,
        100% {
          transform: translateX(0);
        }
        20% {
          transform: translateX(-6px);
        }
        40% {
          transform: translateX(6px);
        }
        60% {
          transform: translateX(-4px);
        }
        80% {
          transform: translateX(4px);
        }
      }

      .check-btn {
        flex-shrink: 0;
        min-width: 48px;
        min-height: 48px;
        padding: 0;
      }

      .solved-row {
        display: none;
        align-items: center;
        gap: 8px;
      }

      .anagram-card.solved .puzzle-input-row {
        display: none;
      }

      .anagram-card.solved .solved-row {
        display: flex;
      }

      .solved-answer {
        font-size: 1.1rem;
        font-weight: 700;
        color: var(--success);
        letter-spacing: 0.06em;
      }

      .solved-row .icon {
        stroke: var(--success);
      }

      .progress {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 20px;
        font-weight: 600;
      }

      @media (max-width: 520px) {
        .anagram-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body data-theme="paw-print">
    <div class="ambient-bg" aria-hidden="true"></div>
<main class="container container-narrow">
    <a href="../index.html" class="back-nav"><i data-lucide="arrow-left" class="icon icon-sm icon-themed"></i> All Puzzles</a>
      <section class="card card-extruded">
        <header class="header">
          <h1 class="font-display">
            <span class="icon-well icon-well-md"><i data-lucide="paw-print" class="icon icon-md icon-themed"></i></span>
            <span class="title-text">Animal Anagrams</span>
          </h1>
          <p class="subtitle">Unscramble the letters to reveal the hidden animal</p>
          <div class="timer" id="timer">0:00</div>
        </header>

        <section class="rules" aria-labelledby="rules-heading">
          <h2 id="rules-heading">How to Play</h2>
          <p>
            Combine <strong>all</strong> the letters from both words — every letter, used exactly once — to spell the name of an animal.
          </p>
          <div class="example">
            <span class="word-chip">BOA</span>
            <span class="sym">+</span>
            <span class="word-chip">LUFF</span>
            <span class="sym">→</span>
            <span class="word-chip answer">BUFFALO</span>
          </div>
        </section>

        <div class="anagram-grid" id="puzzleGrid"></div>

        <div class="progress" id="progress">0 / 4 solved</div>
      </section>
    </main>

    <div class="modal-overlay" id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="winnerTitle">
      <div class="modal">
        <div class="modal-icon"><i data-lucide="party-popper" class="icon icon-xl icon-themed"></i></div>
        <h2 id="winnerTitle" class="font-display">Congrats!</h2>
        <p>You solved every anagram in</p>
        <div class="final-time" id="modalTime">0:00</div>
        <div class="modal-btns">
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Close</button>
          <button type="button" class="btn btn-primary" onclick="resetGame()">Reset &amp; Play Again</button>
        </div>
      </div>
    </div>
<script src="../js/lucide.min.js"></script>
    <script src="../js/icons.js"></script>
    <script>
      const PUZZLES = [
        { words: ["ZEAL", "GEL"], answer: "GAZELLE" },
        { words: ["NEAT", "HELP"], answer: "ELEPHANT" },
        { words: ["BOW", "MAT"], answer: "WOMBAT" },
        { words: ["EVIL", "OWNER"], answer: "WOLVERINE" },
      ]

      let solved = 0
      let timerInterval = null
      let startTime = Date.now()
      let finalTime = ""

      function formatTime(ms) {
        const s = Math.floor(ms / 1000)
        return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`
      }

      function startTimer() {
        timerInterval = setInterval(() => {
          document.getElementById("timer").textContent = formatTime(Date.now() - startTime)
        }, 1000)
      }

      function stopTimer() {
        clearInterval(timerInterval)
        finalTime = formatTime(Date.now() - startTime)
      }

      function renderPuzzles() {
        const grid = document.getElementById("puzzleGrid")
        grid.innerHTML = ""

        PUZZLES.forEach((p, i) => {
          const card = document.createElement("div")
          card.className = "anagram-card"
          card.id = `card-${i}`
          card.innerHTML = `
          <div class="puzzle-words">
            <span class="puzzle-word">${p.words[0]}</span>
            <span class="sym">+</span>
            <span class="puzzle-word">${p.words[1]}</span>
          </div>
          <div class="puzzle-input-row">
            <input
              class="input puzzle-input"
              id="input-${i}"
              type="text"
              placeholder="Type animal…"
              autocomplete="off"
              autocorrect="off"
              autocapitalize="characters"
              spellcheck="false"
            />
            <button type="button" class="btn btn-primary btn-sm check-btn" onclick="checkAnswer(${i})" aria-label="Check">
              <i data-lucide="arrow-right" class="icon icon-sm icon-white"></i>
            </button>
          </div>
          <div class="solved-row">
            <span class="solved-answer" id="answer-${i}"></span>
            <i data-lucide="check-circle" class="icon icon-md"></i>
          </div>
        `
          grid.appendChild(card)

          const input = document.getElementById(`input-${i}`)
          input.addEventListener("keydown", (e) => {
            if (e.key === "Enter") checkAnswer(i)
          })
          input.addEventListener("input", () => input.classList.remove("wrong"))
        })

        PuzzleIcons.initIcons()
      }

      function checkAnswer(i) {
        const card = document.getElementById(`card-${i}`)
        const input = document.getElementById(`input-${i}`)
        if (card.classList.contains("solved")) return

        const val = input.value.trim().toUpperCase()
        if (!val) return

        if (val === PUZZLES[i].answer) {
          card.classList.add("solved")
          document.getElementById(`answer-${i}`).textContent = PUZZLES[i].answer
          solved++
          document.getElementById("progress").textContent = `${solved} / 4 solved`

          if (solved === 4) {
            stopTimer()
            setTimeout(() => {
              document.getElementById("modalTime").textContent = finalTime
              document.getElementById("modalOverlay").classList.add("active")
              PuzzleIcons.initIcons()
            }, 600)
          }
        } else {
          input.classList.remove("wrong")
          void input.offsetWidth
          input.classList.add("wrong")
        }
      }

      function closeModal() {
        document.getElementById("modalOverlay").classList.remove("active")
      }

      function resetGame() {
        closeModal()
        solved = 0
        clearInterval(timerInterval)
        startTime = Date.now()
        document.getElementById("timer").textContent = "0:00"
        document.getElementById("progress").textContent = "0 / 4 solved"
        renderPuzzles()
        startTimer()
      }

      document.addEventListener("DOMContentLoaded", () => {
        PuzzleIcons.initIcons()
        renderPuzzles()
        startTimer()
      })
    </script>
  </body>
</html>
